server:
  port: ${PORT:8080}

spring:
  application:
    name: military-asset-management-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:military_asset_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:${DB_USERNAME:root}}
    password: ${DB_PASS:${DB_PASSWORD:system}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:d29hOTg3Njg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTAxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo=}
    expiration-ms: 86400000 # 24 hours in milliseconds
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.militaryasset: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
